[pytest]
pythonpath = .
asyncio_mode = auto
# Единый event loop на фикстуры и тесты. Движок asyncpg пулит соединения и
# привязывает их к тому loop, в котором был создан, поэтому session-скопная
# фикстура (схема боевой БД) плюс function-скопный loop теста давали
# "Future attached to a different loop" и сыпали весь прогон на Postgres.
# SQLite такого не замечает — отсюда «зелёный» набор в SQLite-джобе.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
# Потолок на один тест ставит tests/conftest.py (pytest_configure): там он
# включается только на POSIX, где работает SIGALRM. На Windows у pytest-timeout
# нет рабочего метода (thread-метод убивает весь прогон), поэтому в CI его
# страхует потолок джобы (timeout-minutes).
markers =
    e2e: сквозной прогон контура на живом тестнете (E2E_TESTNET=1 + тестнет-ключи)
filterwarnings =
    ignore:.*non-checked-in connection.*:sqlalchemy.exc.SAWarning
    error::sqlalchemy.exc.SADeprecationWarning
    error::sqlalchemy.exc.SAWarning
    error::DeprecationWarning
    error::PendingDeprecationWarning