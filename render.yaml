services:
  - type: web
    name: the-ways-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates gnupg && echo "deb http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" > /etc/apt/sources.list.d/pgdg.list && curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg && apt-get update && apt-get install -y --no-install-recommends postgresql-client-17 && pip install -r requirements.txt
    startCommand: python -m app.main
    # Токен защищает операционный снимок /health и /metrics (раньше был открыт).
    # Render-проба — GET без заголовков, поэтому токен живёт прямо в пути и
    # ДОЛЖЕН совпадать с HEALTH_TOKEN ниже (при ротации менять обе части).
    healthCheckPath: /health?token=aAMO5HT2iNIVRD09yLs9x1iyh7tlH2KjWY7jW8Mrjsc
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      # Supabase: сертификат pooler подписан внутренним CA Supabase (не входит
      # в системное хранилище) — приложение верифицирует по этому файлу.
      # Файл certs/supabase-root.pem лежит в репо и попадёт на Render с деплоем.
      - key: DATABASE_CA
        value: certs/supabase-root.pem
      - key: TIMEZONE
        value: Europe/Moscow
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://router.huggingface.co/v1/chat/completions
      - key: GEMINI_API_KEY
        sync: false
      - key: MEDIA_DIR
        value: ./media/generated
      - key: WEBHOOK_SECRET
        sync: false
      - key: HEALTH_TOKEN
        # Доступ к /health и /metrics: мониторинг передаёт токен в
        # Authorization: Bearer либо ?token=. Значение совпадает с
        # healthCheckPath — ротация меняет обе части разом. Защищает только
        # внутренний снимок (очередь выплат, возраст тика, watcher, тревоги),
        # чей эндпоинт раньше был публичным.
        value: "aAMO5HT2iNIVRD09yLs9x1iyh7tlH2KjWY7jW8Mrjsc"
      - key: TON_ENABLED
        value: "false"
      - key: TON_NETWORK
        value: mainnet
      - key: TREASURY_ADDRESS
        sync: false
      - key: TREASURY_MNEMONIC
        sync: false
      - key: TREASURY_TESTNET_ADDRESS
        sync: false
      - key: TREASURY_TESTNET_MNEMONIC
        sync: false
      - key: TON_API_BASE
        value: https://tonapi.io
      - key: TON_API_BASE_TESTNET
        value: https://testnet.tonapi.io
      - key: TON_API_KEY
        sync: false
      - key: TREASURY_WALLET_VERSION
        value: "auto"
      - key: TONCENTER_API_BASE
        value: https://toncenter.com
      - key: TONCENTER_API_BASE_TESTNET
        value: https://testnet.toncenter.com
      - key: TONCENTER_API_KEY
        sync: false
      - key: STAKE_MIN_TON
        value: "0.5"
      - key: OWNER_RAKE_PCT
        value: "0.5"
      - key: LEADERBOARD_RAKE_PCT
        value: "0.5"
      - key: WEEKLY_POT_PCT
        value: "2"
      - key: PACK_FUND_PCT
        value: "1"
      - key: WEEKLY_MIN_DAYS
        value: "4"
      - key: WEEKLY_PRIZE_PCTS
        value: "50,30,20"
      - key: OWNER_WALLET_ADDRESS
        sync: false
      - key: STAKE_CONFIRM_SECONDS
        value: "40"
      - key: PAYOUT_MAX_ATTEMPTS
        value: "5"
      - key: WORLD_NAME
        value: "Эхо Стаи"
      - key: REVOTE_ENABLED
        value: "true"
      - key: REVOTE_STARS
        value: "25"
      - key: REVOTE_TON
        value: "0.1"
