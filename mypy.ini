[mypy]
python_version = 3.12
check_untyped_defs = True
no_implicit_optional = True
warn_unused_ignores = True
warn_redundant_casts = True
show_error_codes = True
pretty = True
# Постепенное внедрение: проверяем только явно перечисленные пакеты
# (app/ton_pay, app/ton_watch, app/rounds). Ошибки в импортируемых модулях
# пока не валят джобу, но их типы всё равно используются.
follow_imports = silent
ignore_missing_imports = True
