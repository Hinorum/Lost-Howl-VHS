[mypy]
python_version = 3.12
check_untyped_defs = True
no_implicit_optional = True
warn_unused_ignores = True
warn_redundant_casts = True
show_error_codes = True
pretty = True
# Охват: весь пакет приложения. Раньше скоуп дублировался в трёх местах
# (mypy.ini, ci.yml, .pre-commit-config.yaml) и разъезжался: список пакетов
# в CI и в локальном хуке можно было забыть расширить, и проверка типов
# тихо покрывала бы всё меньше кода. Один источник правды — здесь.
files = app
# Ошибки в импортируемых модулях (внешние пакеты) не валят джобу, но их
# типы всё равно используются.
follow_imports = silent
ignore_missing_imports = True
