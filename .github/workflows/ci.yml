name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      # Сверка артефактов прямых зависимостей с тем, что PyPI отдаёт СЕЙЧАС.
      # Пин версии `pkg==1.2.3` не защищает от перезалива: PyPI разрешает
      # выложить другое содержимое под занятой версией, и pip примет молча.
      # Любая зависимость исполняется в том процессе, что читает
      # TREASURY_MNEMONIC из окружения, — поэтому в списке все прямые пакеты
      # из requirements.txt, а не только pytoniq. Шаг fail-closed и стоит ДО
      # линта и тестов.
      #
      # Проверяется и хеш, и само множество артефактов: добавленный под ту же
      # версию platform-specific wheel тоже является атакой.
      #
      # Почему не --require-hashes: он требует хешей на всю транзитивную
      # closure и на каждом бампе требует ручной перегенерации lock-файла, то
      # есть ломает еженедельную автоматику Dependabot. Здесь защита без
      # lock-файла: прямые пакеты с хешами, транзитивные — пинами версий.
      - name: Critical dependency artifacts match PyPI
        run: python -m scripts.dependency_hashes
      - name: Lint (runtime errors only)
        run: python -m ruff check .
      # Тот же скрипт, что вешается локальным pre-commit хуком, только в режиме
      # --all: локальный хук проверяет staged, и мнемоника, попавшая в
      # репозиторий мимо него (другая машина, --no-verify), осталась бы незамеченной.
      - name: Secret scan (whole repo)
        run: python scripts/hooks/check_secrets.py --all
      - name: Alembic drift check
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./data/ci_drift.db"
        # Папка data/ в .gitignore, поэтому в свежем checkout её нет, а SQLite
        # не умеет создавать файл в несуществующей папке: «unable to open
        # database file» валил этот шаг и весь джоб, и тесты не доходили.
        run: |
          mkdir -p data
          python -m alembic upgrade head
          python -m alembic check
      - name: Tests (SQLite)
        env:
          BOT_TOKEN: "123456:ci-dummy-token"
          ADMIN_IDS: "1"
        # 85% enforced, при последнем замере 87% (см. README «Покрытие
        # тестами»). Запас в 2 пункта нужен, чтобы джоб ловил неудачное
        # изменение, а не дрожание окружения. Покрытие -- это floor, не цель:
        # качественные тесты важнее числа; конкретные сценарии описаны в
        # docs/architecture.md.
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=85

  # Уязвимость в прод-зависимости не виден НИ ОДНИМ другим шагом: пин
  # `pkg==1.2.3` защищает от перезалива артефактов, но не от Advisory,
  # выпущенного уже после того, как версия была запинена. Здесь — единственный
  # джоб, который смотрит на то, что мы реально ставим на прод.
  #
  # Отдельным джобом, а не шагом в test, и НЕ в зависимостях test/postgres:
  # падение аудита должно читаться как «безопасность», а не смешиваться с
  # падением тестов, и наоборот — при красном аудите тесты обязаны остаться
  # запускаемыми, иначе причину их падения не найти вообще.
  #
  # Ставим requirements-dev.txt, а не `pip install pip-audit==x` строкой в
  # этом файле: пин в requirements-dev.txt подхватывает Dependabot, пин в
  # workflow — нет, и аудитор молча стареет. Это тот же приём, что уже
  # применён к ruff (см. комментарий в requirements-dev.txt).
  #
  # Аудируются только прод-зависимости: dev-окружение (pytest, ruff,
  # pip-audit) на прод не попадает, а его Advisory не про деньги казначея.
  #
  # --strict: без него недоступность OSV — это exit 0 и «всё чисто», то есть
  # сбой проверки маскируется под её успех. Проект в подобных местах
  # сознательно fail-closed (см. комментарий к шагу Critical dependency
  # artifacts match PyPI) — здесь та же логика: лучше красный шаг с явной
  # причиной, чем молчаливое «укрылось».
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Dependency audit (known vulnerabilities)
        run: python -m pip_audit -r requirements.txt --strict

  # Продакшен живет на Supabase Postgres, а основная джоба тестирует только
  # SQLite: прод-инциденты от дрейфа диалектов уже были (VARCHAR-длины
  # вм. truncation, жизненный цикл соединений пулера). Здесь — то, ради чего
  # джоба и появилась: alembic drift-check на свежем PostgreSQL 16 и цепочка
  # миграций на боевом диалекте.
  #
  # Весь набор приложения сюда сознательно НЕ запускается: 66 тестов в 18
  # модулях вставляют строки с захардкоженными внешними ключами, не создавая
  # родителей (например payouts.player_id=42 без игрока 42). SQLite внешние
  # ключи не проверяет, поэтому на SQLite это зелено, а Postgres справедливо
  # ругается. Это дефект тестовых данных, а не приложения, и лечится
  # переписыванием фикстур этих модулей — отдельная задача. Список модулей и
  # причины описаны в README, раздел «PostgreSQL».
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: the_way_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Локальный хост -> postgres_connect_args не включает SSL (см. config.py).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/the_way_ci
      # Тот же URL для flow-тестов миграций: без него они молча уходят в
      # SQLite-файлы, и цепочка на боевом диалекте снова остаётся непроверенной.
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/the_way_ci
      BOT_TOKEN: "123456:ci-dummy-token"
      ADMIN_IDS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Alembic drift check (Postgres)
        run: |
          python -m alembic upgrade head
          python -m alembic check
      # Flow-тесты сами поднимают init_db: alembic upgrade head уже создал
      # схему в the_way_ci, поэтому conftest пойдёт по пути _migrate — так
      # валидируется и рантаймовая миграция на Postgres, а не только свежий
      # create_all. Каждый тест к тому же поднимает свою одноразовую базу.
      - name: Migration flow (Postgres)
        run: python -m pytest -q tests/test_migrations_flow.py
      # advisory lock защиты от двух инстансов — механизм Postgres, на SQLite
      # его проверить нельзя; без этого шага exclusivity лока не проверялась бы
      # никогда.
      - name: Scheduler lock exclusivity (Postgres)
        run: python -m pytest -q tests/test_scheduler_lock.py
