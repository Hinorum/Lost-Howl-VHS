# Статический контроль: ошибки времени выполнения, современный синтаксис
# (UP: pyupgrade / deprecations py3.12), сортировка импортов (I), баги (B).
# RUF100 — мёртвые noqa: директива, переставшая что-либо подавлять после
# рефакторинга, молча живёт в коде и притворяется защитой от линтера.
line-length = 120
target-version = "py312"

[lint]
select = ["E9", "F", "W605", "I", "UP", "B", "RUF100"]
