services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-way}
      # Без дефолта: пароль «way» из прежнего ${POSTGRES_PASSWORD:-way} был
      # одинаков у всех, кто клонировал репозиторий. Порт привязан к
      # 127.0.0.1, но локальная база держит копию реальных данных тестов —
      # читать её может любой локальный процесс/пользователь машины.
      # Fail-closed, как HEALTH_TOKEN в проде: без явного пароля compose
      # не поднимется, а не поднимется с известным паролем.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан - создай .env для compose (пароль любой случайный)}
      POSTGRES_DB: ${POSTGRES_DB:-the_way}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - way_pg:/var/lib/postgresql/data

volumes:
  way_pg:
